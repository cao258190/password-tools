services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-1.0.1}
        APP_COMMIT: ${APP_COMMIT:-}
    container_name: password-tools-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2697
      DATABASE_URL: file:./data/prod.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3910}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SERVER_CRYPTO_SECRET: ${SERVER_CRYPTO_SECRET:?SERVER_CRYPTO_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GITHUB_OWNER: ${GITHUB_OWNER:-cao258190}
      GITHUB_REPO: ${GITHUB_REPO:-password-tools}
      UPDATE_CHECK_REF: ${UPDATE_CHECK_REF:-master}
      WEB_UPDATE_ENABLED: ${WEB_UPDATE_ENABLED:-true}
      UPDATE_COMMAND: ${UPDATE_COMMAND:-sh scripts/docker-web-update.sh}
      UPDATE_PROJECT_DIR: ${UPDATE_PROJECT_DIR:-/workspace/password-tools}
      UPDATE_ENV_FILE: ${UPDATE_ENV_FILE:-.env.docker}
      UPDATE_COMPOSE_FILE: ${UPDATE_COMPOSE_FILE:-docker-compose.yml}
    volumes:
      - password_tools_data:/app/prisma/data
      - .:/workspace/password-tools
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "2697:2697"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2697/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: password-tools-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3910:3910"

volumes:
  password_tools_data:
