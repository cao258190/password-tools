services:
  api:
    image: ${API_IMAGE:-ghcr.io/cao258190/password-tools-api}:${APP_VERSION:-1.0.18}
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-1.0.18}
        APP_COMMIT: ${APP_COMMIT:-}
    container_name: password-tools-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2697
      DATABASE_URL: file:./data/prod.db
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3910}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SERVER_CRYPTO_SECRET: ${SERVER_CRYPTO_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GITHUB_OWNER: ${GITHUB_OWNER:-cao258190}
      GITHUB_REPO: ${GITHUB_REPO:-password-tools}
      UPDATE_CHECK_REF: ${UPDATE_CHECK_REF:-master}
      WEB_UPDATE_ENABLED: ${WEB_UPDATE_ENABLED:-true}
      UPDATE_DETACHED: ${UPDATE_DETACHED:-true}
      UPDATE_COMMAND: "${UPDATE_COMMAND:-sh scripts/request-docker-update.sh}"
      UPDATE_STATUS_FILE: ${UPDATE_STATUS_FILE:-/app/update-state/update-status.json}
      UPDATE_JOB_FILE: ${UPDATE_JOB_FILE:-/app/update-state/update-job.json}
    volumes:
      - password_tools_data:/app/prisma/data
      - password_tools_update_state:/app/update-state
    ports:
      - "2697:2697"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2697/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-ghcr.io/cao258190/password-tools-web}:${APP_VERSION:-1.0.18}
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: password-tools-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3910:3910"

  updater:
    image: ${API_IMAGE:-ghcr.io/cao258190/password-tools-api}:${APP_VERSION:-1.0.18}
    container_name: password-tools-updater
    restart: unless-stopped
    working_dir: ${UPDATE_PROJECT_DIR:-/workspace/password-tools}
    environment:
      UPDATE_CHECK_REF: ${UPDATE_CHECK_REF:-master}
      UPDATE_PROJECT_DIR: ${UPDATE_PROJECT_DIR:-/workspace/password-tools}
      UPDATE_ENV_FILE: ${UPDATE_ENV_FILE:-.env.docker}
      UPDATE_COMPOSE_FILE: ${UPDATE_COMPOSE_FILE:-docker-compose.yml}
      UPDATE_STATUS_FILE: ${UPDATE_STATUS_FILE:-/app/update-state/update-status.json}
      UPDATE_JOB_FILE: ${UPDATE_JOB_FILE:-/app/update-state/update-job.json}
      UPDATE_COMPOSE_SERVICES: "${UPDATE_COMPOSE_SERVICES:-api web}"
      API_IMAGE: ${API_IMAGE:-ghcr.io/cao258190/password-tools-api}
      WEB_IMAGE: ${WEB_IMAGE:-ghcr.io/cao258190/password-tools-web}
      DOCKER_PULL_POLICY: ${DOCKER_PULL_POLICY:-prefer}
    volumes:
      - password_tools_update_state:/app/update-state
      - ${UPDATE_HOST_PROJECT_DIR:-.}:${UPDATE_PROJECT_DIR:-/workspace/password-tools}
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["sh", "scripts/docker-update-daemon.sh"]

volumes:
  password_tools_data:
  password_tools_update_state:
